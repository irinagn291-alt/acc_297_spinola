name: Cryostat
packages:
  Alamofire:
    url: https://github.com/rg8tv2gc29-tech/Alamofire
    revision: 3ea8e93ec37a3ae5f255afb529ef20f438dd1903
  AppsFlyerLib:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework-Static
    from: 6.17.9
options:
  bundleIdPrefix: com.cryostat
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Cryostat:
    type: application
    platform: iOS
    sources:
    - path: Cryostat
    resources:
    - path: PrivacyInfo.xcprivacy
    dependencies:
    - package: Alamofire
    - package: AppsFlyerLib
      product: AppsFlyerLib-Static
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryostat.bento
        PRODUCT_NAME: Cryostat
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_NSUserTrackingUsageDescription: "We use this identifier to personalize your experience and measure app performance."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_CFBundleDisplayName: Spinola
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: 'YES'
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Support/Cryostat-Info.plist
  CryostatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - path: CryostatTests
    dependencies:
    - target: Cryostat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cryostat.bento.tests
        GENERATE_INFOPLIST_FILE: 'YES'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        SWIFT_VERSION: '6.2'
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cryostat.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Cryostat
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
schemes:
  Cryostat:
    build:
      targets:
        Cryostat: all
        CryostatTests:
        - test
    test:
      targets:
      - CryostatTests
